[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "fraud-triage-agent"
version = "0.1.0"
description = "LangGraph agent that triages suspicious card transactions with Claude"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Helen Aramyan" }]
requires-python = ">=3.12"
dependencies = [
  "anthropic[bedrock]==1.2.0",
  "langgraph==1.2.11",
  "langgraph-checkpoint-sqlite==3.1.1",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "typer==0.27.2",
  "rich==15.0.0",
  "pyyaml==6.0.3",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "ruff==0.16.5",
  "mypy==2.3.1",
  "types-PyYAML==6.0.12.20260815",
]

[project.scripts]
fraud-triage = "fraud_triage.cli:app"

[project.urls]
Homepage = "https://github.com/HelenArams/fraud-triage-agent"

[tool.hatch.build.targets.wheel]
packages = ["src/fraud_triage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]  # formatter handles line length; long strings are fine

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[tool.ruff.lint.isort]
known-first-party = ["fraud_triage"]
known-local-folder = ["factories"]
